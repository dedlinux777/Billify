spring:
  application:
    name: billify-core-service

  datasource:
    url: ${SPRING_DATASOURCE_URL_CORE:jdbc:mysql://localhost:3306/core_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        globally_quoted_identifiers: false

# Custom JWT Properties
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${accessTokenExpiration}
  refresh-token-expiration: ${refreshTokenExpiration}

server:
  port: ${SERVER_PORT:8080}

frontend:
  url: ${FRONTEND_URL}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%thread] %-40.40logger{39} [correlationId: %X{correlationId}] : %m%n"



management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always