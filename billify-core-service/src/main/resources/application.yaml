spring:
  application:
    name: billify

  datasource:
    url: ${SPRING_DATASOURCE_URL_CORE:jdbc:mysql://localhost:3306/core_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        globally_quoted_identifiers: false

# Custom JWT Properties
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${accessTokenExpiration}
  refresh-token-expiration: ${refreshTokenExpiration}

server:
  port: ${SERVER_PORT:8080}

frontend:
  url: ${FRONTEND_URL}

